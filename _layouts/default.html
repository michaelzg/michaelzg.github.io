<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="site-wrap">
    {% include header.html %}

    <main class="post p2 p-responsive wrap" id="content">
      <div class="measure">
        {{ content }}
      </div>
    </main>
  </div>

  {% include footer.html %}

<script src="{{ "/assets/js/site.js" | relative_url }}"></script>
<script src="{{ "/assets/js/hi-logo.js" | relative_url }}"></script>
{% if page.extra_scripts %}
  {% for script in page.extra_scripts %}
<script src="{{ script | relative_url }}"></script>
  {% endfor %}
{% endif %}

</body>
</html>
