# Site settings
title:       Hi
email:       ""
author:      ""
description: "Writing on software, projects, and experiments."
baseurl:     ""
url:         "https://michaelzg.com"
github:      ""
twitter:     "https://twitter.com/mchlgao"

# Google analytics
google_analytics:

# Optional features
show_related_posts: false

# Build settings
markdown:     kramdown
redcarpet:
  extensions: ['smart', 'tables', 'with_toc_data']
permalink:    pretty
paginate:     6
sass:
  compressed: true
highlighter: rouge

plugins: [jekyll-paginate]

# Build tooling lives in the repository but is not site content, so keep it out
# of _site. Of the frontend sources, Jekyll only publishes the compiled demo
# under assets/demos/.
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - vite.config.js
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - scripts
